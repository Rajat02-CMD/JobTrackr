<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Job Trackr</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<header>
    <!-- navbar -->
    <nav>

        <div class="logo">
            <h2>JobTrackr</h2>
        </div>

        <div class="nav-links">
            <a href="#">Dashboard</a>
            <a href="#">Applications</a>
        </div>

        <button>+ Add Application</button>

    </nav>
</header>

<!-- dashboard -->
 <main>

    <section class="dashboard">

        <div class="dashboard-header">
            <h1>Track Your Career</h1>
            <p>Manage your job applications in one place.</p>
        </div>

        <div class="stats">

            <div class="stat-card">
                <h3>Total Applications</h3>
                <span id="total-count">0</span>
            </div>

            <div class="stat-card">
                <h3>Interviews</h3>
                <span id="interview-count">0</span>
            </div>

            <div class="stat-card">
                <h3>Selected</h3>
                <span id="selected-count">0</span>
            </div>

            <div class="stat-card">
                <h3>Rejected</h3>
                <span id="rejected-count">0</span>
            </div>

        </div>

    </section>

</main>

<!-- application section -->
 <section class="applications-section">

    <div class="section-header">
        <div>
            <h2>Your Applications</h2>
            <p>Keep track of your job applications.</p>
        </div>

        <button>+ Add Application</button>
    </div>

    <div id="applications-list">
        <p>No applications added yet.</p>
    </div>

</section>





<script src="script.js"></script>
</body>
</html>
