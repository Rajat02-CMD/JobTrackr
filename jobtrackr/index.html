<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Job Trackr</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="responsive.css">
</head>
<body>

<header>
    <!-- navbar -->
    <nav>

        <div class="logo">
            <h2>JobTrackr</h2>
        </div>

        <div class="nav-links">
            <a href="#">Dashboard</a>
            <a href="#">Applications</a>
        </div>

        <button id="nav-add-btn">+ Add Application</button>

    </nav>
</header>

<!-- dashboard -->
 <main>

    <section class="dashboard">

        <div class="dashboard-header">
            <h1>Track Your Career</h1>
            <p>Manage your job applications in one place.</p>
        </div>

        <div class="stats">

            <div class="stat-card">
                <h3>Total Applications</h3>
                <span id="total-count">0</span>
            </div>

            <div class="stat-card">
                <h3>Interviews</h3>
                <span id="interview-count">0</span>
            </div>

            <div class="stat-card">
                <h3>Selected</h3>
                <span id="selected-count">0</span>
            </div>

            <div class="stat-card">
                <h3>Rejected</h3>
                <span id="rejected-count">0</span>
            </div>

        </div>

    </section>

</main>

<!-- application section -->
 <section class="applications-section">

    <div class="section-header">
        <div>
            <h2>Your Applications</h2>
            <p>Keep track of your job applications.</p>
        </div>

        <button id="section-add-btn">+ Add Application</button>
    </div>

    <div class="application-form">
    <div class="form-group">
        <label for="company">Company</label>
        <input type="text" id="company" placeholder="e.g. TCS">
    </div>

    <div class="form-group">
        <label for="role">Role</label>
        <input type="text" id="role" placeholder="e.g. Frontend Developer">
    </div>

    <div class="form-group">
        <label for="applied-date">Applied Date</label>
        <input type="date" id="applied-date">
    </div>

    <div class="form-group">
        <label for="status">Status</label>
        <select id="status">
            <option value="Applied">Applied</option>
            <option value="Interview">Interview</option>
            <option value="Selected">Selected</option>
            <option value="Rejected">Rejected</option>
        </select>
    </div>

    <button id="add-application-btn">Add Application</button>
</div>

    <div class="application-controls">

    <input
        type="text"
        id="search-input"
        placeholder="Search company or role..."
    >

    <select id="filter-status">
        <option value="All">All Status</option>
        <option value="Applied">Applied</option>
        <option value="Interview">Interview</option>
        <option value="Selected">Selected</option>
        <option value="Rejected">Rejected</option>
    </select>

</div>


    <div id="applications-list">
        <p>No applications added yet.</p>
    </div>

</section>





<script src="script.js"></script>
</body>
</html>
